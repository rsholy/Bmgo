
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFS_divya_vrx | BMGO Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #090e1c, #152b46, #101322);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile {
      width: 100%;
      max-width: 440px;
      background: #111b2d;
      border: 1px solid #294667;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 45px #0008;
    }

    .banner {
      height: 125px;
      background:
        radial-gradient(circle at 50% 100%, #27d9ff66, transparent 60%),
        linear-gradient(120deg, #164e63, #312e81, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .content {
      padding: 25px;
      text-align: center;
    }

    .avatar {
      width: 85px;
      height: 85px;
      margin: -68px auto 15px;
      position: relative;
      display: grid;
      place-items: center;
      background: #172b45;
      border: 3px solid #49d8ff;
      border-radius: 50%;
      font-size: 38px;
    }

    .tag {
      color: #55dcff;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: #a8b9ce;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .wealth {
      padding: 20px 10px;
      background: linear-gradient(110deg, #153c43, #17334b);
      border: 1px solid #27717a;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .wealth small {
      color: #a8eaf0;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .amount {
      color: #67f5d0;
      font-size: 39px;
      font-weight: 900;
      margin-top: 7px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
    }

    .stat {
      padding: 15px;
      background: #19263a;
      border-radius: 12px;
      border: 1px solid #293b53;
    }

    .stat small {
      color: #9eafc6;
      font-size: 11px;
    }

    .stat p {
      margin-top: 7px;
      font-size: 16px;
      font-weight: bold;
    }

    .achievement {
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #292443;
      border: 1px solid #57418d;
      color: #d9c7ff;
      font-weight: bold;
      font-size: 13px;
    }

    footer {
      margin-top: 22px;
      color: #7589a5;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="profile">
    <div class="banner">⚔️</div>

    <div class="content">
      <div class="avatar">👑</div>

      <div class="tag">BMGO • PLAYER PROFILE</div>
      <h1>SFS_divya_vrx</h1>
      <p class="subtitle">Skyblock Player</p>

      <section class="wealth">
        <small>TOTAL VALUE MADE</small>
        <div class="amount">100M+</div>
      </section>

      <section class="stats">
        <div class="stat">
          <small>ACHIEVEMENT</small>
          <p>100M Club</p>
        </div>
        <div class="stat">
          <small>PLAYER STATUS</small>
          <p>Skyblock</p>
        </div>
      </section>

      <div class="achievement">
        🏆 100M+ Milestone Unlocked
      </div>

      <footer>
        Fan-made BMGO profile • Player stats are not independently verified
      </footer>
    </div>
  </main>
</body>
  </html>
